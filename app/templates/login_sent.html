{% extends "layout.html" %}
{% block title %}Check your email · Parlay{% endblock %}
{% block content %}
<div class="max-w-xs mx-auto pt-16 sm:pt-24">
  <h1 class="text-lg font-semibold">Check your email</h1>
  <p class="mt-2 text-muted">Link sent to {{ email }}</p>
  {% if dev_link %}
    <a class="mt-8 block text-sm break-all underline underline-offset-4" href="{{ dev_link }}">{{ dev_link }}</a>
  {% endif %}
  <p class="mt-8"><a class="link" href="/login">Use a different email</a></p>
</div>
{% endblock %}
